appId: com.formation.shelfscan
name: Ajouter un livre à la bibliothèque
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "(?i)development servers"
    commands:
      - openLink: "exp+shelfscan://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Continue|While using the app|Saisir un ISBN"
    timeout: 90000
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - tapOn: "Close"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- extendedWaitUntil:
    visible: "Saisir un ISBN"
    timeout: 30000
- tapOn: "Saisir un ISBN"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "9780441013593"
- assertVisible: "9780441013593"
- hideKeyboard
- tapOn: "Rechercher"
- extendedWaitUntil:
    visible: "Ajouter à ma bibliothèque"
    timeout: 20000
- assertVisible: "Dune"
- tapOn: "Ajouter à ma bibliothèque"
- assertVisible: "Ajouté à la bibliothèque"
- back
- tapOn: "Bibliothèque"
- assertVisible: "Dune"
