appId: com.formation.shelfscan
name: Ajouter un livre à la bibliothèque
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "(?i)development servers"
    commands:
      - openLink: "exp+shelfscan://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Saisir un ISBN"
    timeout: 90000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Don.t [Aa]llow"
    commands:
      - tapOn: "Don.t [Aa]llow"
- tapOn: "Saisir un ISBN"
- inputText: "9780441013593"
- hideKeyboard
- tapOn: "Rechercher"
- assertVisible: "Dune"
- tapOn: "Ajouter à ma bibliothèque"
- assertVisible: "Ajouté à la bibliothèque"
- back
- tapOn: "Bibliothèque"
- assertVisible: "Dune"
